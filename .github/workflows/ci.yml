name: CI / Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npx tsc -b

      - name: Linting & Code Quality Audit
        run: npm run lint

      - name: Automated Integration & Telemetry Tests
        run: npm test

      - name: Production Vite Build
        run: npm run build
